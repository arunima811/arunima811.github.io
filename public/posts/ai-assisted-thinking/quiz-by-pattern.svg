<svg xmlns="http://www.w3.org/2000/svg" width="640" height="268" viewBox="0 0 640 268" role="img" aria-label="Quiz scores: 67% without AI and 50% with AI. Within the AI group, three ways of using it scored 65% or more and three scored under 40%. Pattern bars stop at the band edge, not an exact score." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="640" height="268" fill="#ffffff"/><text x="110" y="35" text-anchor="end" font-size="12" fill="#1b1b1b">No AI, average</text><path d="M120,24 H556.0 Q560.0,24 560.0,28.0 V36.0 Q560.0,40 556.0,40 H120 Z" fill="#c3c2b7"/><text x="568.0" y="36" font-size="11" font-weight="600" fill="#1b1b1b">67%</text><rect x="0" y="20" width="640" height="30" fill="transparent"><title>Developers who learned without AI: 67% average quiz score</title></rect><text x="110" y="65" text-anchor="end" font-size="12" fill="#1b1b1b">With AI, average</text><path d="M120,54 H444.4 Q448.4,54 448.4,58.0 V66.0 Q448.4,70 444.4,70 H120 Z" fill="#2a78d6"/><text x="456.4" y="66" font-size="11" font-weight="600" fill="#1b1b1b">50%</text><rect x="0" y="50" width="640" height="30" fill="transparent"><title>Developers who learned with AI: 50% average quiz score</title></rect><text x="110" y="95" text-anchor="end" font-size="12" fill="#1b1b1b">Concepts only</text><path d="M120,84 H542.9 Q546.9,84 546.9,88.0 V96.0 Q546.9,100 542.9,100 H120 Z" fill="#86b6ef"/><text x="554.9" y="96" font-size="11" font-weight="600" fill="#1b1b1b">65% or more</text><rect x="0" y="80" width="640" height="30" fill="transparent"><title>Asked only conceptual questions (7 people): scored 65% or more; second-fastest pattern overall</title></rect><text x="110" y="125" text-anchor="end" font-size="12" fill="#1b1b1b">Code + explain</text><path d="M120,114 H542.9 Q546.9,114 546.9,118.0 V126.0 Q546.9,130 542.9,130 H120 Z" fill="#86b6ef"/><text x="554.9" y="126" font-size="11" font-weight="600" fill="#1b1b1b">65% or more</text><rect x="0" y="110" width="640" height="30" fill="transparent"><title>Asked for code together with explanations (3 people): scored 65% or more</title></rect><text x="110" y="155" text-anchor="end" font-size="12" fill="#1b1b1b">Generate, ask</text><path d="M120,144 H542.9 Q546.9,144 546.9,148.0 V156.0 Q546.9,160 542.9,160 H120 Z" fill="#86b6ef"/><text x="554.9" y="156" font-size="11" font-weight="600" fill="#1b1b1b">65% or more</text><rect x="0" y="140" width="640" height="30" fill="transparent"><title>Generated code, then asked questions to understand it (2 people): scored 65% or more</title></rect><text x="110" y="185" text-anchor="end" font-size="12" fill="#1b1b1b">Full handoff</text><path d="M120,174 H378.7 Q382.7,174 382.7,178.0 V186.0 Q382.7,190 378.7,190 H120 Z" fill="#86b6ef"/><text x="390.7" y="186" font-size="11" font-weight="600" fill="#1b1b1b">under 40%</text><rect x="0" y="170" width="640" height="30" fill="transparent"><title>Delegated the whole task to AI (4 people): scored under 40%</title></rect><text x="110" y="215" text-anchor="end" font-size="12" fill="#1b1b1b">Growing reliance</text><path d="M120,204 H378.7 Q382.7,204 382.7,208.0 V216.0 Q382.7,220 378.7,220 H120 Z" fill="#86b6ef"/><text x="390.7" y="216" font-size="11" font-weight="600" fill="#1b1b1b">under 40%</text><rect x="0" y="200" width="640" height="30" fill="transparent"><title>Relied on AI more and more as the task went on (4 people): scored under 40%</title></rect><text x="110" y="245" text-anchor="end" font-size="12" fill="#1b1b1b">AI debugging</text><path d="M120,234 H378.7 Q382.7,234 382.7,238.0 V246.0 Q382.7,250 378.7,250 H120 Z" fill="#86b6ef"/><text x="390.7" y="246" font-size="11" font-weight="600" fill="#1b1b1b">under 40%</text><rect x="0" y="230" width="640" height="30" fill="transparent"><title>Had AI debug the code, round after round (4 people): scored under 40%</title></rect></svg>
